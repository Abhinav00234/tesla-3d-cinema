<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171a20'/%3E%3Cpath d='M12 9v14l11-7z' fill='%23f4f4f4'/%3E%3C/svg%3E">
  <title>Enter PIN - 3D Cinema</title>
  <style>
    /* Same tokens as css/style.css. Kept inline so this page needs nothing else before the PIN is entered. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #0f1115; color: #f4f4f4;
      font-family: "Universal Sans Text", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    main { width: min(92vw, 360px); text-align: center; }
    h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.42em; margin-right: -0.42em; white-space: nowrap; }
    p { margin-top: 14px; font-size: 16px; color: #d0d1d2; }
    #dots { display: flex; justify-content: center; gap: 12px; height: 16px; margin: 28px 0 10px; }
    #dots span { width: 12px; height: 12px; border-radius: 50%; background: #f4f4f4; }
    #message { min-height: 24px; font-size: 16px; color: #f0907f; }
    #keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    button {
      height: 68px; border: none; border-radius: 4px;
      background: #22262e; color: #f4f4f4;
      font: 400 24px/1 inherit; font-family: inherit; cursor: pointer; touch-action: manipulation;
      transition: background-color 0.33s cubic-bezier(0.5, 0, 0, 0.75);
    }
    button:active { background: #2e333d; }
    button:focus-visible { outline: 3px solid #f4f4f4; outline-offset: 2px; }
    button.word { font-size: 16px; font-weight: 500; }
    button.go { background: #3e6ae1; color: #fff; }
    button.go:active { background: #3457b9; }
    button:disabled { opacity: 0.5; }
    @media (hover: hover) {
      button:hover { background: #2e333d; }
      button.go:hover { background: #3457b9; }
    }
  </style>
</head>
<body>
<main>
  <h1 translate="no">CINEMA 3D</h1>
  <p id="prompt">Enter the PIN to open the library</p>
  <div id="dots" role="status" aria-live="polite" aria-label="No digits entered"></div>
  <div id="message" role="alert"></div>
  <div id="keys" aria-describedby="prompt">
    <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
    <button type="button" class="word" data-key="back">Delete</button><button type="button" data-key="0">0</button><button type="button" class="word go" data-key="go">Open</button>
  </div>
</main>
<script>
  const dots = document.getElementById('dots');
  const message = document.getElementById('message');
  const goBtn = document.querySelector('[data-key="go"]');
  let pin = '';
  let sending = false;

  function draw() {
    dots.innerHTML = '';
    for (let i = 0; i < pin.length; i++) dots.appendChild(document.createElement('span'));
    dots.setAttribute('aria-label', pin.length ? `${pin.length} digits entered` : 'No digits entered');
  }

  async function submit() {
    if (sending) return;
    if (!pin) { message.textContent = 'Enter the PIN first.'; return; }
    sending = true;
    goBtn.disabled = true;
    goBtn.textContent = 'Opening…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin }),
      });
      if (res.ok) { location.replace('/'); return; }
      const data = await res.json().catch(() => ({}));
      message.textContent = data.error ? `${data.error} Try again.`.replace('again. Try again.', 'again.') : 'That did not work. Try again.';
    } catch (err) {
      message.textContent = 'The server did not answer. Check that it is still running.';
    }
    pin = '';
    draw();
    sending = false;
    goBtn.disabled = false;
    goBtn.textContent = 'Open';
  }

  function press(key) {
    if (key === 'go') return submit();
    message.textContent = '';
    if (key === 'back') pin = pin.slice(0, -1);
    else if (pin.length < 12) pin += key;
    draw();
  }

  document.getElementById('keys').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) press(btn.dataset.key);
  });
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
    else if (e.key === 'Enter' && document.activeElement?.dataset?.key === undefined) press('go');
  });
</script>
</body>
</html>
