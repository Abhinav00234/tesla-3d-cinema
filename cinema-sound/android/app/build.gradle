plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abhinav.cinemasound'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abhinav.cinemasound'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // The app is the web page in ../../web, shown in a WebView
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
