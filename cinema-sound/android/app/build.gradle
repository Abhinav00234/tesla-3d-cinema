plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abhinav.cinemasound'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abhinav.cinemasound'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    // The app is the web page in ../../web, shown in a WebView
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    // One key that lives in the repository, so every APK built by GitHub
    // Actions installs as an update over the last one. It is not secret:
    // use your own key if you publish the app to a store.
    signingConfigs {
        shared {
            storeFile file('../cinema-sound.keystore')
            storePassword 'cinemasound'
            keyAlias 'cinemasound'
            keyPassword 'cinemasound'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
